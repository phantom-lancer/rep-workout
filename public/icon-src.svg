<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151b26"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8ecfa"/>
      <stop offset="55%" stop-color="#a8d2ee"/>
      <stop offset="100%" stop-color="#7ba9cd"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#04070c" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- плитка -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#tile)"/>
  <!-- верхняя световая кромка -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#edge)"/>

  <!-- монограмма R: холодное стекло -->
  <g filter="url(#soft)" opacity="0.98">
    <path d="M196 378 L196 134 M196 134 L292 134 C340 134 372 162 372 206 C372 250 340 278 292 278 L196 278 M282 278 L348 378"
      fill="none" stroke="url(#ice)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- блик на верхней грани буквы -->
  <g opacity="0.5">
    <path d="M196 134 L292 134" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
